# Example nginx site for the public website (put next to Clinika's own nginx config).
# Replace klinika.uz with your domain, then: certbot --nginx -d klinika.uz -d www.klinika.uz
server {
    listen 80;
    server_name klinika.uz www.klinika.uz;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
